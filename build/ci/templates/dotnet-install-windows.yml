parameters:
  DotNetVersion: '10.0.102'
  UnoCheck_Version: '1.33.1'
  UnoCheck_Manifest: 'https://raw.githubusercontent.com/unoplatform/uno.check/1.33.1/manifests/uno.ui.manifest.json'

steps:

  - task: UseDotNet@2
    displayName: 'Use .NET Core SDK ${{ parameters.DotNetVersion }}'
    retryCountOnTaskFailure: 3
    inputs:
      packageType: sdk
      version: ${{ parameters.DotNetVersion }}
      includePreviewVersions: true

  - powershell: |
      & dotnet tool update --global uno.check --version ${{ parameters.UnoCheck_Version }} --add-source https://api.nuget.org/v3/index.json
      & uno-check -v --ci --non-interactive --fix --skip xcode --skip gtk3 --skip vswin --skip androidemulator --skip androidsdk --skip vsmac --manifest ${{ parameters.UnoCheck_Manifest }}
    displayName: Install .NET Workloads
    errorActionPreference: continue
    ignoreLASTEXITCODE: true
    retryCountOnTaskFailure: 3

  - task: DotNetCoreCLI@2
    displayName: 'Restore .NET Workloads'
    inputs:
      command: 'custom'
      custom: 'workload'
      arguments: 'restore Uno.ShowMeTheXAML.sln'
